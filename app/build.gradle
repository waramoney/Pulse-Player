plugins {
    id 'com.android.application'
}

def stableSigning = ['PULSE_KEYSTORE_PATH', 'PULSE_KEYSTORE_PASS', 'PULSE_KEY_PASS', 'PULSE_KEY_ALIAS']
        .every { System.getenv(it) }

android {
    signingConfigs {
        personal {
            if (stableSigning) {
                storeFile file(System.getenv('PULSE_KEYSTORE_PATH'))
                storePassword System.getenv('PULSE_KEYSTORE_PASS')
                keyAlias System.getenv('PULSE_KEY_ALIAS')
                keyPassword System.getenv('PULSE_KEY_PASS')
            }
        }
    }

    namespace 'com.pulse.player'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pulse.player'
        minSdk 26
        targetSdk 35
        versionCode 138
        versionName '1.3.8'
    }
    buildTypes {
        release {
            if (stableSigning) signingConfig signingConfigs.personal
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
