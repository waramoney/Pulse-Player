<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d15">
  <meta name="color-scheme" content="dark">
  <title>Pulse Player · 음악 & 동영상</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><path d="M9 18c0 1.7-1.8 3-4 3s-4-1.3-4-3 1.8-3 4-3 4 1.3 4 3Zm11-2c0 1.7-1.8 3-4 3s-4-1.3-4-3 1.8-3 4-3 4 1.3 4 3Z" transform="translate(1 -1) scale(.96)"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="2.5" y="4.5" width="19" height="15" rx="3"/><path d="m10 9 5 3-5 3Z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.6" cy="10.6" r="6.6"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 7.4a4.7 4.7 0 0 0-8-3.1L12 5l-.8-.7a4.7 4.7 0 0 0-8 3.1c0 4.4 4.5 7.9 8.8 11.4 4.3-3.5 8.8-7 8.8-11.4Z" transform="translate(0 1.5)"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z" stroke-linejoin="round"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="3"/></symbol>
    <symbol id="i-skip-prev" viewBox="0 0 24 24"><path d="M5 5v14M19 5 7 12l12 7V5Z"/></symbol>
    <symbol id="i-skip-next" viewBox="0 0 24 24"><path d="M19 5v14M5 5l12 7-12 7V5Z"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 6h3c5 0 7 12 12 12h3m-4-4 4 4-4 4M3 18h3c2.5 0 4-2.6 5.5-5.2M14 9c1-1.9 2.2-3 4-3h3m-4-4 4 4-4 4"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4m14-1v2a3 3 0 0 1-3 3H3"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m4 0-1 14H6L5 7m5 4v6m4-6v6"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-headphones" viewBox="0 0 24 24"><path d="M4 13V11a8 8 0 0 1 16 0v2m-16 0h3a2 2 0 0 1 2 2v4H6a2 2 0 0 1-2-2v-4Zm16 0h-3a2 2 0 0 0-2 2v4h3a2 2 0 0 0 2-2v-4Z"/></symbol>
    <symbol id="i-fullscreen" viewBox="0 0 24 24"><path d="M4 9V4h5m6 0h5v5M4 15v5h5m6 0h5v-5"/></symbol>
  </svg>

  <div class="page-glow" aria-hidden="true"></div>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-symbol"><span></span><span></span><span></span></span>
        <div><strong>PULSE<span>PLAYER</span></strong><small>MY MEDIA. MY VIBE.</small></div>
      </div>
      <button class="top-add" id="topAdd" aria-label="음악 또는 영상 추가" title="음악 또는 영상 추가">
        <svg class="ico"><use href="#i-plus"></use></svg>
      </button>
    </header>

    <div class="desktop-grid">
      <main class="left-column">
        <section class="intro" aria-label="소개">
          <div class="intro-label"><span class="status-dot"></span> MY OFFLINE PLAYLIST</div>
          <h1>내 음악과 영상을<br><em>한곳에서.</em></h1>
          <p>좋아하는 순간을, 언제 어디서든.</p>
        </section>

        <section class="player" aria-labelledby="now-heading">
          <div class="player-top">
            <div class="playing-badge"><span class="mini-eq" id="miniEqualizer"><i></i><i></i><i></i></span> NOW PLAYING</div>
            <span class="offline-label">● 100% OFFLINE</span>
          </div>

          <div class="visual" id="visual">
            <div class="visual-light"></div>
            <div class="vinyl-wrap" id="vinylWrap">
              <div class="vinyl" id="vinyl"><div class="vinyl-sticker"><svg class="ico"><use href="#i-music"></use></svg></div></div>
            </div>
            <video id="browserVideo" class="browser-video" playsinline preload="metadata" hidden></video>
            <div class="visual-caption" id="visualCaption">YOUR MUSIC, YOUR MOMENT</div>
          </div>

          <div class="track-info">
            <div class="track-text">
              <div class="track-eyebrow" id="trackEyebrow">READY TO PLAY</div>
              <h2 id="now-heading"><span id="currentTitle">음악을 추가해 보세요</span></h2>
              <p id="currentArtist">내 기기에서 파일을 선택하세요</p>
            </div>
            <button class="favorite-current circle-btn" id="favoriteCurrent" aria-label="즐겨찾기 추가" title="즐겨찾기">
              <svg class="ico"><use href="#i-heart"></use></svg>
            </button>
          </div>

          <div class="progress-area">
            <input class="progress" type="range" id="progress" min="0" max="1000" value="0" aria-label="재생 위치 이동">
            <div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
          </div>

          <div class="transport" aria-label="재생 컨트롤">
            <button id="shuffle" class="minor-btn" aria-label="셔플 켜기" title="셔플"><svg class="ico"><use href="#i-shuffle"></use></svg></button>
            <button id="previous" class="step-btn" aria-label="이전 곡"><svg class="ico"><use href="#i-skip-prev"></use></svg></button>
            <button id="togglePlayback" class="play-btn" aria-label="재생"><svg class="ico" id="playIcon"><use href="#i-play"></use></svg></button>
            <button id="next" class="step-btn" aria-label="다음 곡"><svg class="ico"><use href="#i-skip-next"></use></svg></button>
            <button id="repeat" class="minor-btn" aria-label="반복 설정" title="반복"><svg class="ico"><use href="#i-repeat"></use></svg><sup id="repeatOne" hidden>1</sup></button>
          </div>
          <div class="player-footer">
            <span class="footer-hint"><svg class="ico"><use href="#i-headphones"></use></svg> <span id="footerHint">기기에서 직접 재생</span></span>
            <button class="speed" id="speed" aria-label="재생 속도 변경">1.0× <svg class="ico"><use href="#i-chevron"></use></svg></button>
          </div>
        </section>
      </main>

      <section class="library" aria-labelledby="libraryTitle">
        <div class="library-top">
          <div><p class="section-label">MY COLLECTION</p><h2 id="libraryTitle">내 라이브러리 <span id="mediaCount">0</span></h2></div>
          <button id="libraryAdd" class="add-button"><svg class="ico"><use href="#i-plus"></use></svg> 파일 추가</button>
        </div>

        <div class="search-wrap">
          <svg class="ico"><use href="#i-search"></use></svg>
          <input type="search" id="search" placeholder="음악, 영상 검색" autocomplete="off" aria-label="음악, 영상 검색">
          <kbd id="searchCount" hidden>0개</kbd>
        </div>
        <div class="filter-row" role="tablist" aria-label="미디어 종류">
          <button class="filter active" data-filter="all" role="tab" aria-selected="true">전체 <span id="allCount">0</span></button>
          <button class="filter" data-filter="audio" role="tab" aria-selected="false">음악 <span id="musicCount">0</span></button>
          <button class="filter" data-filter="video" role="tab" aria-selected="false">영상 <span id="videoCount">0</span></button>
          <button class="filter" data-filter="favorite" role="tab" aria-selected="false"><svg class="ico"><use href="#i-heart"></use></svg> 즐겨찾기</button>
        </div>
        <div id="trackList" class="track-list" aria-live="polite"></div>
        <div class="library-footer"><svg class="ico"><use href="#i-folder"></use></svg> 파일은 서버에 업로드되지 않아요.</div>
      </section>
    </div>
    <footer class="site-footer"><span>Ⓟ PULSE PLAYER</span><span>PRIVATE • OFFLINE • YOURS</span></footer>
  </div>
  <input id="fileInput" type="file" accept="audio/*,video/*,.mp3,.m4a,.wav,.flac,.ogg,.mp4,.mkv,.webm" multiple hidden>
  <audio id="browserAudio" preload="metadata" hidden></audio>
  <div class="toast" role="status" aria-live="polite" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
