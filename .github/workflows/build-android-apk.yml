name: Build Pulse Player APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - 'downloads/**'
      - 'README.md'

permissions:
  contents: read

jobs:
  android:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDK_MANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDK_MANAGER" ]]; then
            SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi
          if [[ -z "$SDK_MANAGER" || ! -x "$SDK_MANAGER" ]]; then
            echo "::error::Android SDK manager not found on GitHub-hosted runner"
            exit 1
          fi
          "$SDK_MANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate JavaScript
        run: node --check app/src/main/assets/app.js
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PulsePlayer-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
