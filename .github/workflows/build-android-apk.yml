name: Build Pulse Player APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'
      - 'README.md'
      - 'SIGNING_SETUP.md'

permissions:
  contents: read

concurrency:
  group: pulse-android-build
  cancel-in-progress: true

jobs:
  android:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDK_MANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDK_MANAGER" ]]; then
            SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi
          if [[ -z "$SDK_MANAGER" || ! -x "$SDK_MANAGER" ]]; then
            echo "::error::Android SDK manager not found"
            exit 1
          fi
          "$SDK_MANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate JavaScript and update contracts
        run: |
          node --check app/src/main/assets/app.js
          node tests/contract.cjs
      - name: Configure private signing, if available
        env:
          PULSE_RELEASE_SIGNING_JSON: ${{ secrets.PULSE_RELEASE_SIGNING_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, base64, pathlib
          raw = os.environ.get('PULSE_RELEASE_SIGNING_JSON', '').strip()
          env = pathlib.Path(os.environ['GITHUB_ENV'])
          if not raw:
              with env.open('a') as f: f.write('PULSE_SIGNED=false\n')
              print('No signing secret: creating a test-only debug APK. Upgrades require a stable release signing secret.')
          else:
              obj = json.loads(raw)
              file = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pulse-private-release.p12'
              file.write_bytes(base64.b64decode(obj['keystoreBase64'], validate=True))
              os.chmod(file, 0o600)
              for key, value in [
                  ('PULSE_SIGNED','true'),
                  ('PULSE_KEYSTORE_PATH',str(file)),
                  ('PULSE_KEYSTORE_PASS',obj['storePassword']),
                  ('PULSE_KEY_PASS',obj['keyPassword']),
                  ('PULSE_KEY_ALIAS',obj['alias'])
              ]:
                  if '\n' in value or '\r' in value: raise ValueError('Invalid signing config')
                  with env.open('a') as f: f.write(key+'='+value+'\n')
              print('Private release signing enabled.')
          PY
      - name: Compile APK
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PULSE_SIGNED" == "true" ]]; then
            gradle --no-daemon :app:assembleRelease
          else
            gradle --no-daemon :app:assembleDebug
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulsePlayer-v1.3.8-APK
          path: app/build/outputs/apk/*/app-*.apk
          if-no-files-found: error
          retention-days: 14
