name: Build unsigned Pulse Player for private local signing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-unsigned-personal.yml'

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK dependencies
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDK_MANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDK_MANAGER" ]]; then
            SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi
          "$SDK_MANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Source checks
        run: |
          node --check app/src/main/assets/app.js
          node tests/contract.cjs
      - name: Compile unsigned release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Upload unsigned APK for offline signing
        uses: actions/upload-artifact@v4
        with:
          name: PulsePlayer-v1.3.8-Unsigned-Release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 2
